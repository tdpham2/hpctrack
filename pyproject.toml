[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpctrack"
version = "0.1.0"
description = "Reproducible HPC software records and resumable job tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9", "pydantic>=2.7,<3", "jinja2>=3.1,<4", "requests>=2.31,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
iri = ["alcf-tokens"]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1"]

[project.scripts]
hpctrack = "hpctrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpctrack = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

name: Offline checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check src tests examples scripts
      - run: ruff format --check src tests examples scripts
      - run: python -m build
      - name: Smoke-test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
          wheel_python="$PWD/.venv-wheel/bin/python"
          smoke_script="$PWD/scripts/wheel_smoke.py"
          smoke_cwd="$(mktemp -d)"
          cd "$smoke_cwd"
          env -u PYTHONPATH "$wheel_python" "$smoke_script"

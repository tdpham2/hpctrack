# ALCF IRI API jobs with SSH for files. Replace every REPLACE_* value.
records_dir: records
state_dir: state
machines:
  polaris:
    backend: iri
    transport: ssh
    ssh_alias: polaris
    user: REPLACE_USERNAME
    resource_id: REPLACE_CONFIRMED_RESOURCE_ID
    software_root: /REPLACE_PROJECT/software
    work_root: /REPLACE_PROJECT/jobs
    queues:
      debug:
        min_nodes: 1
        max_nodes: 1
        min_walltime: 300
        max_walltime: 600
        max_active: 1
    accounts: [REPLACE_ACCOUNT]
    filesystems: [REPLACE_FILESYSTEM]
    max_nodes: 1
    max_walltime: 600
    max_node_hours: 0.2
  aurora:
    backend: iri
    transport: ssh
    ssh_alias: aurora
    user: REPLACE_USERNAME
    resource_id: REPLACE_CONFIRMED_RESOURCE_ID
    software_root: /REPLACE_PROJECT/software
    work_root: /REPLACE_PROJECT/jobs
    queues:
      debug:
        min_nodes: 1
        max_nodes: 1
        min_walltime: 300
        max_walltime: 600
        max_active: 1
    accounts: [REPLACE_ACCOUNT]
    filesystems: [REPLACE_FILESYSTEM]
    max_nodes: 1
    max_walltime: 600
    max_node_hours: 0.2
